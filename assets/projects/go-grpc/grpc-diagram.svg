<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="1000" height="800" fill="white"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90E2"/>
    </marker>
    
    <marker id="grpc-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00D084"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Go Microservices Architecture
  </text>
  <text x="500" y="55" font-size="14" text-anchor="middle" fill="#7F8C8D">
    GraphQL Gateway + gRPC Services + Docker
  </text>
  
  <!-- Client Layer -->
  <rect x="400" y="90" width="200" height="80" rx="8" fill="#3498DB" filter="url(#shadow)"/>
  <text x="500" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Client Application</text>
  <text x="500" y="140" font-size="12" text-anchor="middle" fill="white">Web / Mobile</text>
  <text x="500" y="158" font-size="11" text-anchor="middle" fill="#ECF0F1">GraphQL Queries</text>
  
  <!-- Arrow from Client to GraphQL Gateway -->
  <line x1="500" y1="170" x2="500" y2="220" stroke="#4A90E2" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="520" y="200" font-size="11" fill="#4A90E2" font-weight="bold">GraphQL</text>
  
  <!-- GraphQL Gateway -->
  <rect x="350" y="220" width="300" height="100" rx="8" fill="#E74C3C" filter="url(#shadow)"/>
  <text x="500" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="white">GraphQL Gateway</text>
  <text x="500" y="272" font-size="12" text-anchor="middle" fill="white">API Gateway Layer</text>
  <text x="500" y="292" font-size="11" text-anchor="middle" fill="#FADBD8">Port: 8080</text>
  <rect x="370" y="298" width="260" height="18" rx="4" fill="#C0392B"/>
  <text x="500" y="310" font-size="10" text-anchor="middle" fill="white">Docker Container: graphql-service</text>
  
  <!-- gRPC arrows from GraphQL to services -->
  <line x1="400" y1="320" x2="250" y2="400" stroke="#00D084" stroke-width="3" marker-end="url(#grpc-arrow)"/>
  <text x="310" y="360" font-size="11" fill="#00D084" font-weight="bold">gRPC</text>
  
  <line x1="500" y1="320" x2="500" y2="400" stroke="#00D084" stroke-width="3" marker-end="url(#grpc-arrow)"/>
  <text x="520" y="360" font-size="11" fill="#00D084" font-weight="bold">gRPC</text>
  
  <line x1="600" y1="320" x2="750" y2="400" stroke="#00D084" stroke-width="3" marker-end="url(#grpc-arrow)"/>
  <text x="690" y="360" font-size="11" fill="#00D084" font-weight="bold">gRPC</text>
  
  <!-- Account Service -->
  <rect x="100" y="400" width="280" height="140" rx="8" fill="#9B59B6" filter="url(#shadow)"/>
  <text x="240" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Account Service</text>
  <text x="240" y="452" font-size="12" text-anchor="middle" fill="white">User Management</text>
  <text x="240" y="474" font-size="11" text-anchor="middle" fill="#E8DAEF">gRPC Server: :50051</text>
  <rect x="120" y="484" width="240" height="18" rx="4" fill="#7D3C98"/>
  <text x="240" y="496" font-size="10" text-anchor="middle" fill="white">Docker: account-service</text>
  <rect x="120" y="508" width="240" height="24" rx="4" fill="#5B2C6F"/>
  <text x="240" y="524" font-size="11" text-anchor="middle" fill="white">PostgreSQL Database</text>
  
  <!-- Catalog Service -->
  <rect x="410" y="400" width="280" height="140" rx="8" fill="#16A085" filter="url(#shadow)"/>
  <text x="550" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Catalog Service</text>
  <text x="550" y="452" font-size="12" text-anchor="middle" fill="white">Product Management</text>
  <text x="550" y="474" font-size="11" text-anchor="middle" fill="#A9DFBF">gRPC Server: :50052</text>
  <rect x="430" y="484" width="240" height="18" rx="4" fill="#138D75"/>
  <text x="550" y="496" font-size="10" text-anchor="middle" fill="white">Docker: catalog-service</text>
  <rect x="430" y="508" width="240" height="24" rx="4" fill="#0E6655"/>
  <text x="550" y="524" font-size="11" text-anchor="middle" fill="white">Elasticsearch</text>
  
  <!-- Additional Service (Future) -->
  <rect x="720" y="400" width="240" height="140" rx="8" fill="#F39C12" opacity="0.6" filter="url(#shadow)"/>
  <text x="840" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Order Service</text>
  <text x="840" y="452" font-size="12" text-anchor="middle" fill="white">(Future/Example)</text>
  <text x="840" y="474" font-size="11" text-anchor="middle" fill="white">gRPC Server: :50053</text>
  <rect x="740" y="484" width="200" height="18" rx="4" fill="#D68910"/>
  <text x="840" y="496" font-size="10" text-anchor="middle" fill="white">Docker: order-service</text>
  <rect x="740" y="508" width="200" height="24" rx="4" fill="#9A7D0A"/>
  <text x="840" y="524" font-size="11" text-anchor="middle" fill="white">Database</text>
  
  <!-- Database connections -->
  <line x1="240" y1="540" x2="240" y2="600" stroke="#5B2C6F" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="540" x2="550" y2="600" stroke="#0E6655" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- PostgreSQL -->
  <rect x="150" y="600" width="180" height="70" rx="8" fill="#336791" filter="url(#shadow)"/>
  <text x="240" y="625" font-size="14" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
  <text x="240" y="645" font-size="11" text-anchor="middle" fill="#D4E6F1">User Accounts</text>
  <text x="240" y="662" font-size="10" text-anchor="middle" fill="#D4E6F1">Port: 5432</text>
  
  <!-- Elasticsearch -->
  <rect x="460" y="600" width="180" height="70" rx="8" fill="#005571" filter="url(#shadow)"/>
  <text x="550" y="625" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Elasticsearch</text>
  <text x="550" y="645" font-size="11" text-anchor="middle" fill="#D6EAF8">Product Search</text>
  <text x="550" y="662" font-size="10" text-anchor="middle" fill="#D6EAF8">Port: 9200</text>
  
  <!-- Docker Network -->
  <rect x="50" y="370" width="920" height="330" rx="12" fill="none" stroke="#34495E" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="70" y="395" font-size="13" font-weight="bold" fill="#34495E">Docker Network: go-grpc-network</text>
  
  <!-- Legend -->
  <g transform="translate(50, 720)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2C3E50">Legend:</text>
    
    <line x1="0" y1="15" x2="40" y2="15" stroke="#4A90E2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="50" y="20" font-size="11" fill="#2C3E50">GraphQL</text>
    
    <line x1="150" y1="15" x2="190" y2="15" stroke="#00D084" stroke-width="3" marker-end="url(#grpc-arrow)"/>
    <text x="200" y="20" font-size="11" fill="#2C3E50">gRPC</text>
    
    <rect x="300" y="8" width="50" height="14" rx="3" fill="#E74C3C"/>
    <text x="360" y="20" font-size="11" fill="#2C3E50">Gateway</text>
    
    <rect x="450" y="8" width="50" height="14" rx="3" fill="#9B59B6"/>
    <text x="510" y="20" font-size="11" fill="#2C3E50">Service</text>
    
    <rect x="600" y="8" width="50" height="14" rx="3" fill="#336791"/>
    <text x="660" y="20" font-size="11" fill="#2C3E50">Database</text>
  </g>
  
  <!-- Technology Stack -->
  <g transform="translate(750, 700)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#2C3E50">Tech Stack:</text>
    <text x="0" y="18" font-size="10" fill="#555">• Go (Golang)</text>
    <text x="0" y="33" font-size="10" fill="#555">• GraphQL</text>
    <text x="0" y="48" font-size="10" fill="#555">• gRPC + Protobuf</text>
    <text x="0" y="63" font-size="10" fill="#555">• Docker Compose</text>
  </g>
</svg>